apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: college-events
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-events
      tier: backend
  template:
    metadata:
      labels:
        app: college-events
        tier: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/vesit-group11/smart-event-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: jwt-secret
          ports:
            - containerPort: 5000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: college-events
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: college-events
    tier: backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: college-events
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: college-events
    tier: backend
  ports:
    - port: 5000
      targetPort: 5000
